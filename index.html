<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUXE LAB — Colaborador: @aiko_seong</title>

<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    background:
        radial-gradient(
            circle at 50% 5%,
            rgba(120, 0, 20, 0.45),
            transparent 32%
        ),
        radial-gradient(
            circle at 10% 40%,
            rgba(80, 0, 15, 0.18),
            transparent 30%
        ),
        linear-gradient(
            180deg,
            #180005 0%,
            #0b0205 45%,
            #030203 100%
        );

    color: #eeeeee;
    font-family: Arial, Helvetica, sans-serif;
    padding: 28px 20px 60px;
}


/* =========================
   MORCEGOS
========================= */

.bats {
    position: fixed;
    top: 110px;
    left: 0;

    width: 100%;

    display: flex;
    justify-content: space-around;
    align-items: center;

    padding: 0 20px;

    font-size: 24px;

    opacity: 0.28;

    filter:
        drop-shadow(0 0 5px #8d001b)
        drop-shadow(0 0 10px #40000b);

    pointer-events: none;
    z-index: 0;

    animation: batsFloat 5s ease-in-out infinite;
}

@keyframes batsFloat {

    0% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(10px);
    }

    100% {
        transform: translateY(0);
    }
}


/* =========================
   CABEÇALHO
========================= */

header {
    position: relative;
    z-index: 2;

    text-align: center;

    margin: 20px auto 115px;

    max-width: 800px;
}


/* TÍTULO */

h1 {
    position: relative;

    display: inline-block;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: clamp(42px, 11vw, 72px);

    font-weight: 900;

    letter-spacing: 5px;

    text-transform: uppercase;

    color: #ffffff;

    text-shadow:
        0 0 4px #ffffff,
        0 0 10px #ff2448,
        0 0 22px #ff002f,
        0 0 40px #900018;

    animation: horrorGlow 3s ease-in-out infinite;
}

@keyframes horrorGlow {

    0%, 100% {
        text-shadow:
            0 0 4px #ffffff,
            0 0 10px #ff2448,
            0 0 22px #ff002f,
            0 0 40px #900018;
    }

    50% {
        text-shadow:
            0 0 5px #ffffff,
            0 0 15px #ff0033,
            0 0 32px #ff002f,
            0 0 55px #76000f;
    }
}


/* =========================
   SANGUE ESCORRENDO
========================= */

h1::before {
    content: "";

    position: absolute;

    left: 13%;
    top: 86%;

    width: 8px;
    height: 38px;

    background:
        linear-gradient(
            to bottom,
            #ff123d 0%,
            #c00027 45%,
            #60000f 100%
        );

    border-radius:
        0 0 8px 8px;

    box-shadow:
        42px 4px 0 -1px #a50020,
        88px 1px 0 -2px #730015,
        145px 7px 0 -1px #b00022;

    filter:
        drop-shadow(0 0 5px #ff0033);

    animation: bloodDrop 3.5s ease-in-out infinite;
}

@keyframes bloodDrop {

    0%, 100% {
        transform: scaleY(.75);
        transform-origin: top;
    }

    50% {
        transform: scaleY(1.15);
        transform-origin: top;
    }
}


/* gotas extras */

h1::after {
    content: "•  •   •";

    position: absolute;

    left: 25%;
    top: 104%;

    color: #b50023;

    font-family: Arial, sans-serif;

    font-size: 15px;

    letter-spacing: 22px;

    text-shadow:
        0 0 5px #ff002f,
        0 0 12px #75000f;

    opacity: .9;
}


/* =========================
   SUBTÍTULO
========================= */

.subtitle {
    margin-top: 22px;

    color: #c8aeb2;

    font-size: clamp(13px, 3.5vw, 18px);

    letter-spacing: 4px;

    text-transform: uppercase;

    line-height: 1.8;

    text-shadow:
        0 0 8px rgba(255, 0, 45, .25);
}


/* =========================
   ÁREA DO PROMPT
========================= */

.prompts {
    position: relative;
    z-index: 2;

    max-width: 900px;

    margin: auto;
}


/* =========================
   ÚNICO CARD
========================= */

.card {
    position: relative;

    background:
        radial-gradient(
            circle at 90% 10%,
            rgba(150, 0, 30, .12),
            transparent 25%
        ),
        linear-gradient(
            145deg,
            #19070b,
            #090306
        );

    border: 1px solid #8f142c;

    border-radius: 4px;

    padding: 46px 34px 38px;

    box-shadow:
        0 0 20px rgba(170, 0, 35, .12),
        inset 0 0 30px rgba(100, 0, 20, .08);

    overflow: hidden;
}


/* linha vermelha superior */

.card::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 135px;
    height: 8px;

    background:
        linear-gradient(
            90deg,
            #ff0038,
            #d00029,
            transparent
        );

    box-shadow:
        0 0 12px #ff0038,
        0 0 25px rgba(255, 0, 50, .6);
}


/* brilho lateral */

.card::after {
    content: "✦";

    position: absolute;

    top: 28px;
    right: 28px;

    color: #ff1744;

    font-size: 28px;

    text-shadow:
        0 0 8px #ff0038,
        0 0 20px #a0001e;

    animation: starPulse 2.5s infinite;
}

@keyframes starPulse {

    0%, 100% {
        opacity: .55;
        transform: scale(.9);
    }

    50% {
        opacity: 1;
        transform: scale(1.1);
    }
}


/* =========================
   TÍTULO DO PROMPT
========================= */

.card h2 {
    position: relative;

    color: #ffffff;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: clamp(30px, 7vw, 48px);

    line-height: 1.15;

    letter-spacing: 2px;

    text-transform: uppercase;

    margin-bottom: 32px;

    text-shadow:
        0 0 5px #ffffff,
        0 0 12px rgba(255, 0, 45, .45);
}


/* =========================
   TEXTO
========================= */

.card p {
    color: #d8cdd0;

    font-size: clamp(17px, 4.5vw, 22px);

    line-height: 1.9;

    letter-spacing: .3px;

    margin-bottom: 34px;
}


/* =========================
   BOTÃO
========================= */

.copy {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-width: 280px;

    padding: 17px 30px;

    border: 1px solid #ff1744;

    border-radius: 4px;

    background:
        linear-gradient(
            135deg,
            #ff0038,
            #c5002b
        );

    color: #ffffff;

    font-size: 17px;

    font-weight: 900;

    letter-spacing: 1px;

    text-transform: uppercase;

    cursor: pointer;

    box-shadow:
        0 0 10px rgba(255, 0, 50, .45),
        0 0 25px rgba(255, 0, 50, .2);

    transition:
        transform .2s,
        box-shadow .2s,
        background .2s;
}

.copy:hover {
    transform: translateY(-2px);

    background:
        linear-gradient(
            135deg,
            #ff1744,
            #e00032
        );

    box-shadow:
        0 0 15px #ff1744,
        0 0 35px rgba(255, 0, 50, .45);
}

.copy:active {
    transform: scale(.97);
}


/* =========================
   MÚSICA
========================= */

.music-area {
    margin-top: 35px;

    text-align: center;

    color: #6f555b;

    font-size: 13px;

    letter-spacing: 2px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    body {
        padding: 20px 14px 50px;
    }

    header {
        margin-bottom: 100px;
    }

    h1 {
        font-size: 43px;
        letter-spacing: 3px;
    }

    .subtitle {
        font-size: 12px;
        letter-spacing: 3px;
    }

    .bats {
        top: 105px;
        font-size: 19px;
    }

    .card {
        padding: 40px 24px 30px;
    }

    .card h2 {
        font-size: 34px;
        padding-right: 20px;
    }

    .card p {
        font-size: 18px;
        line-height: 1.9;
    }

    .copy {
        width: 100%;
        min-width: 0;
        font-size: 15px;
        padding: 17px 15px;
    }
}

</style>
</head>


<body>

<!-- MORCEGOS -->

<div class="bats">
    <span>🦇</span>
    <span>🦇</span>
    <span>🦇</span>
    <span>🦇</span>
</div>


<!-- CABEÇALHO -->

<header>

    <h1>LUXE LAB</h1>

    <p class="subtitle">
        PROMPTS EXCLUSIVOS • COLABORADOR: @AIKO_SEONG
    </p>

</header>


<!-- ÚNICO PROMPT -->

<section class="prompts">

    <div class="card">

        <h2>
            🎨 Prompt<br>
            Realista
        </h2>

        <p id="prompt">

            Crie uma imagem ultra-realista, com iluminação
            cinematográfica, detalhes naturais da pele,
            sombras suaves, alta definição, profundidade
            de campo e aparência profissional.

        </p>

        <button
            class="copy"
            onclick="copiarPrompt()"
        >
            📋 &nbsp; Copiar Prompt
        </button>

    </div>

</section>


<div class="music-area">
    LUXE LAB • DARK HORROR
</div>


<script>

/* =========================
   COPIAR PROMPT
========================= */

function copiarPrompt() {

    const texto =
        document.getElementById("prompt").innerText.trim();

    navigator.clipboard.writeText(texto)
        .then(function() {

            alert("Prompt copiado! 🩸");

        })
        .catch(function() {

            alert("Não foi possível copiar o prompt.");

        });

}

</script>

</body>
    </html>
