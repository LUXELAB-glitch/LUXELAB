<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUXE LAB</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background:
        radial-gradient(circle at 50% 5%, rgba(255,0,40,.30), transparent 28%),
        radial-gradient(circle at 15% 35%, rgba(150,0,25,.20), transparent 30%),
        radial-gradient(circle at 90% 70%, rgba(120,0,20,.16), transparent 30%),
        linear-gradient(180deg, #190004 0%, #090204 55%, #010101 100%);
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   FUNDO
========================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        radial-gradient(circle, rgba(255,0,40,.14) 1px, transparent 1px);
    background-size: 42px 42px;
    opacity: .28;
    z-index: 0;
}

/* =========================
   MORCEGOS GRANDES
========================= */

.bat {
    position: fixed;
    z-index: 1;
    pointer-events: none;
    font-size: 65px;
    opacity: .75;
    filter:
        drop-shadow(0 0 7px #ff003c)
        drop-shadow(0 0 18px rgba(255,0,50,.55));
    animation: batFly 9s linear infinite;
}

.bat1 {
    top: 15%;
    left: -100px;
}

.bat2 {
    top: 40%;
    left: -140px;
    font-size: 85px;
    animation-delay: 3s;
}

.bat3 {
    top: 68%;
    left: -120px;
    font-size: 58px;
    animation-delay: 6s;
}

@keyframes batFly {

    0% {
        transform:
            translateX(0)
            translateY(0)
            rotate(-8deg);
    }

    25% {
        transform:
            translateX(25vw)
            translateY(-45px)
            rotate(8deg);
    }

    50% {
        transform:
            translateX(55vw)
            translateY(35px)
            rotate(-5deg);
    }

    75% {
        transform:
            translateX(80vw)
            translateY(-30px)
            rotate(7deg);
    }

    100% {
        transform:
            translateX(125vw)
            translateY(20px)
            rotate(-5deg);
    }
}

/* =========================
   GOTAS DE SANGUE
========================= */

.blood {
    position: fixed;
    z-index: 1;
    pointer-events: none;
    width: 7px;
    height: 35px;
    background: linear-gradient(#ff003c, #8b001d);
    border-radius: 0 0 8px 8px;
    box-shadow:
        0 0 8px #ff003c,
        0 0 18px rgba(255,0,45,.7);
    animation: bloodDrop linear infinite;
}

.blood:nth-of-type(4) {
    left: 12%;
    top: -45px;
    animation-duration: 5s;
}

.blood:nth-of-type(5) {
    left: 29%;
    top: -70px;
    height: 55px;
    animation-duration: 7s;
    animation-delay: 1s;
}

.blood:nth-of-type(6) {
    left: 51%;
    top: -50px;
    height: 42px;
    animation-duration: 6s;
    animation-delay: 2s;
}

.blood:nth-of-type(7) {
    left: 73%;
    top: -80px;
    height: 65px;
    animation-duration: 8s;
    animation-delay: 1.5s;
}

.blood:nth-of-type(8) {
    left: 90%;
    top: -40px;
    height: 30px;
    animation-duration: 5.5s;
    animation-delay: 3s;
}

@keyframes bloodDrop {

    0% {
        transform: translateY(-80px) scaleY(.5);
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    75% {
        opacity: .9;
    }

    100% {
        transform: translateY(110vh) scaleY(1.25);
        opacity: 0;
    }
}

/* =========================
   CONTAINER
========================= */

.container {
    position: relative;
    z-index: 3;
    width: 100%;
    max-width: 720px;
    margin: auto;
    padding: 55px 20px 80px;
}

/* =========================
   CABEÇALHO
========================= */

header {
    text-align: center;
    margin-bottom: 125px;
}

.logo {
    position: relative;
    display: inline-block;
    font-size: clamp(45px, 13vw, 76px);
    font-weight: 900;
    letter-spacing: 4px;
    color: #fff;

    text-shadow:
        0 0 5px #fff,
        0 0 12px #ff003c,
        0 0 25px #ff003c,
        0 0 55px #b00025;
}

/* sangue saindo das letras */

.logo .drip {
    position: absolute;
}

/* gotas intensas embaixo do logo */

.logo::before {
    content: "";
    position: absolute;
    left: 8%;
    bottom: -30px;
    width: 9px;
    height: 48px;
    background: linear-gradient(#ff1748, #780018);
    border-radius: 0 0 10px 10px;

    box-shadow:
        48px 5px 0 #c9002f,
        91px -3px 0 #ff1748,
        138px 8px 0 #8c001d,
        185px -5px 0 #d60034;

    filter:
        drop-shadow(0 0 7px #ff003c)
        drop-shadow(0 0 15px #ff003c);

    animation: intenseBlood 2.8s ease-in-out infinite;
}

@keyframes intenseBlood {

    0%,100% {
        transform: scaleY(.65);
        opacity: .7;
    }

    50% {
        transform: scaleY(1.35);
        opacity: 1;
    }
}

.subtitle {
    margin-top: 35px;
    color: #c2aeb2;
    font-size: 14px;
    letter-spacing: 4px;
    line-height: 1.9;
    text-transform: uppercase;
}

/* =========================
   CARD ÚNICO
========================= */

.card {
    position: relative;
    background:
        linear-gradient(
            145deg,
            rgba(45,0,10,.94),
            rgba(6,1,3,.98)
        );

    border: 1px solid #9b102b;
    border-radius: 10px;
    padding: 48px 38px 40px;

    box-shadow:
        0 0 25px rgba(255,0,45,.16),
        0 0 70px rgba(120,0,25,.08),
        inset 0 0 35px rgba(150,0,30,.08);

    overflow: hidden;
}

/* barra vermelha */

.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 130px;
    height: 6px;

    background: #ff003c;

    box-shadow:
        0 0 10px #ff003c,
        0 0 25px #ff003c,
        0 0 45px #ff003c;
}

/* estrela */

.card::after {
    content: "✦";
    position: absolute;
    right: 28px;
    top: 25px;

    color: #ff1748;
    font-size: 32px;

    text-shadow:
        0 0 8px #ff003c,
        0 0 20px #ff003c,
        0 0 35px #ff003c;

    animation: sparkle 1.8s infinite alternate;
}

@keyframes sparkle {

    from {
        opacity: .35;
        transform: scale(.8) rotate(-8deg);
    }

    to {
        opacity: 1;
        transform: scale(1.2) rotate(12deg);
    }
}

/* =========================
   TÍTULO
========================= */

.card h2 {
    font-size: clamp(32px, 8vw, 50px);
    line-height: 1.15;
    margin-bottom: 45px;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 1px;

    text-shadow:
        0 0 5px #fff,
        0 0 13px rgba(255,0,55,.8),
        0 0 25px rgba(255,0,55,.3);
}

/* =========================
   TEXTO
========================= */

.card p {
    color: #d9c7ca;
    font-size: 20px;
    line-height: 1.9;
    margin-bottom: 38px;
}

/* =========================
   BOTÃO
========================= */

.copy {
    width: 100%;
    border: 1px solid #ff1748;
    border-radius: 5px;
    padding: 19px 25px;

    background:
        linear-gradient(
            135deg,
            #ff003c,
            #bd002c
        );

    color: white;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 1px;
    cursor: pointer;

    box-shadow:
        0 0 12px rgba(255,0,55,.55),
        0 0 30px rgba(255,0,55,.22);

    transition: .25s;
}

.copy:active {
    transform: scale(.97);
}

/* =========================
   BOTÃO MÚSICA
========================= */

.music {
    display: block;
    margin: 28px auto 0;

    border: 1px solid #781226;
    background: rgba(20,2,7,.9);

    color: #d9c1c6;

    border-radius: 5px;
    padding: 12px 22px;

    font-size: 13px;
    cursor: pointer;
}

/* =========================
   RODAPÉ
========================= */

footer {
    text-align: center;
    margin-top: 55px;

    color: #765961;
    font-size: 12px;
    letter-spacing: 4px;
}

/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .container {
        padding: 42px 20px 70px;
    }

    header {
        margin-bottom: 110px;
    }

    .logo {
        font-size: 47px;
    }

    .subtitle {
        font-size: 11px;
        letter-spacing: 3px;
    }

    .card {
        padding: 42px 34px 35px;
    }

    .card h2 {
        font-size: 35px;
    }

    .card p {
        font-size: 19px;
        line-height: 1.9;
    }

    .bat {
        font-size: 55px;
    }

    .bat2 {
        font-size: 70px;
    }
}
</style>
</head>

<body>

<!-- MORCEGOS GRANDES -->
<div class="bat bat1">🦇</div>
<div class="bat bat2">🦇</div>
<div class="bat bat3">🦇</div>

<!-- SANGUE -->
<div class="blood"></div>
<div class="blood"></div>
<div class="blood"></div>
<div class="blood"></div>
<div class="blood"></div>

<div class="container">

<header>

    <h1 class="logo">
        LUXE LAB
    </h1>

    <p class="subtitle">
        PROMPTS EXCLUSIVOS • COLABORADOR:<br>
        @AIKO_SEONG
    </p>

</header>

<!-- ÚNICA CAIXA -->
<section class="card">

    <h2>
        🎨 PROMPT<br>
        REALISTA
    </h2>

    <p id="prompt">
        Crie uma imagem ultra-realista, com iluminação
        cinematográfica, detalhes naturais da pele,
        sombras suaves, alta definição, profundidade de
        campo e aparência profissional.
    </p>

    <button class="copy" onclick="copiarPrompt()">
        📋 &nbsp; COPIAR PROMPT
    </button>

</section>

<!-- MÚSICA -->
<audio id="musica" loop preload="auto">
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<button class="music" onclick="controlarMusica()">
    🎵 Tocar música
</button>

<footer>
    ✦ LUXE LAB ✦
</footer>

</div>

<script>

/* =========================
   MÚSICA AO PRIMEIRO TOQUE
========================= */

const musica = document.getElementById("musica");
const botaoMusica = document.querySelector(".music");

let musicaIniciada = false;

function iniciarMusica() {

    if (musicaIniciada) return;

    musica.play()
        .then(() => {

            musicaIniciada = true;
            botaoMusica.innerHTML = "⏸️ Pausar música";

        })
        .catch(() => {

            /*
            Se o navegador bloquear o primeiro toque,
            o botão de música continua disponível.
            */

        });
}

/*
   Qualquer primeiro toque na tela
   tenta iniciar a música.
*/

document.addEventListener(
    "pointerdown",
    iniciarMusica,
    { once: true }
);


/* =========================
   BOTÃO DA MÚSICA
========================= */

function controlarMusica() {

    if (musica.paused) {

        musica.play();

        musicaIniciada = true;

        botaoMusica.innerHTML =
            "⏸️ Pausar música";

    } else {

        musica.pause();

        botaoMusica.innerHTML =
            "🎵 Tocar música";
    }
}


/* =========================
   COPIAR PROMPT
========================= */

function copiarPrompt() {

    const texto =
        document.getElementById("prompt").innerText;

    navigator.clipboard.writeText(texto)
        .then(() => {

            const botao =
                document.querySelector(".copy");

            botao.innerHTML =
                "✅ &nbsp; PROMPT COPIADO";

            setTimeout(() => {

                botao.innerHTML =
                    "📋 &nbsp; COPIAR PROMPT";

            }, 2000);

        });
}

</script>

</body>
</html>
