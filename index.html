<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUXE LAB — Colaborador: @aiko_seong</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    padding:30px 20px 60px;
    font-family:Arial,Helvetica,sans-serif;
    color:#f5f5f5;
    background:
        radial-gradient(circle at 50% 0%,rgba(190,0,35,.20),transparent 35%),
        linear-gradient(180deg,#120306 0%,#070708 55%,#030304 100%);
}

/* ===== CABEÇALHO ===== */

header{
    text-align:center;
    margin:10px auto 38px;
    max-width:900px;
}

.logo{
    position:relative;
    display:inline-block;
    font-size:42px;
    font-weight:900;
    letter-spacing:3px;
    color:#fff;
    text-shadow:
        0 0 5px #fff,
        0 0 15px #ff1638,
        0 0 30px rgba(255,0,40,.8);
}

.logo::after{
    content:"LUXE LAB";
    position:absolute;
    left:0;
    top:7px;
    width:100%;
    color:#ff1740;
    opacity:.45;
    transform:translate(5px,8px);
    filter:blur(2px);
    z-index:-1;
}

.subtitle{
    margin-top:18px;
    color:#aaa;
    font-size:15px;
    letter-spacing:4px;
    text-transform:uppercase;
}

/* ===== ÚNICO TEMA ===== */

.controls{
    display:flex;
    justify-content:center;
    margin-bottom:48px;
}

.theme{
    display:none;
}

/* ===== ÚNICO PROMPT ===== */

.prompts{
    width:100%;
    max-width:900px;
    margin:auto;
}

.card{
    position:relative;
    overflow:hidden;
    padding:32px;
    border:1px solid #8e1028;
    border-radius:8px;
    background:
        linear-gradient(
            145deg,
            rgba(38,5,12,.96),
            rgba(8,7,9,.98)
        );
    box-shadow:
        0 0 20px rgba(255,0,45,.08),
        inset 0 0 35px rgba(120,0,20,.08);
}

.card::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:74px;
    height:5px;
    background:#ff1238;
    box-shadow:0 0 12px #ff1238;
}

.card::after{
    content:"✦";
    position:absolute;
    top:28px;
    right:30px;
    color:#ff1744;
    font-size:25px;
    text-shadow:0 0 12px #ff1744;
}

.card h2{
    font-size:31px;
    margin-bottom:28px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#f7f7f7;
}

.card p{
    color:#c9c9c9;
    font-size:19px;
    line-height:2;
    margin-bottom:30px;
}

.copy{
    border:1px solid #ff1744;
    border-radius:5px;
    padding:17px 28px;
    background:linear-gradient(135deg,#ff0035,#c90029);
    color:#fff;
    font-size:16px;
    font-weight:900;
    letter-spacing:.5px;
    cursor:pointer;
    box-shadow:
        0 0 12px rgba(255,0,45,.35),
        inset 0 0 10px rgba(255,255,255,.08);
    transition:.2s;
}

.copy:hover{
    transform:translateY(-2px);
    box-shadow:
        0 0 22px rgba(255,0,45,.55);
}

.copy:active{
    transform:scale(.98);
}

/* ===== RESPONSIVO ===== */

@media(max-width:600px){

    body{
        padding:25px 20px 50px;
    }

    .logo{
        font-size:35px;
    }

    .subtitle{
        font-size:12px;
        letter-spacing:3px;
        line-height:1.8;
    }

    .card{
        padding:30px 28px;
    }

    .card h2{
        font-size:28px;
        padding-right:25px;
    }

    .card p{
        font-size:18px;
        line-height:2;
    }

    .copy{
        width:auto;
        font-size:15px;
    }
}
</style>
</head>

<body>

<header>

    <h1 class="logo">LUXE LAB</h1>

    <p class="subtitle">
        PROMPTS EXCLUSIVOS • COLABORADOR: @AIKO_SEONG
    </p>

</header>

<div class="controls">
    <div class="theme"></div>
</div>

<section class="prompts">

    <div class="card">

        <h2>🎨 Prompt Realista</h2>

        <p id="prompt">
            Crie uma imagem ultra-realista, com iluminação
            cinematográfica, detalhes naturais da pele, sombras
            suaves, alta definição, profundidade de campo e
            aparência profissional.
        </p>

        <button class="copy" onclick="copiarPrompt()">
            📋 &nbsp; COPIAR PROMPT
        </button>

    </div>

</section>

<script>

function copiarPrompt(){

    const texto = document.getElementById("prompt").innerText;

    navigator.clipboard.writeText(texto)
        .then(() => {
            alert("Prompt copiado! ✅");
        })
        .catch(() => {
            alert("Não foi possível copiar o prompt.");
        });

}

</script>

</body>
</html>
