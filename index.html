<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUXE LAB</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 8%, rgba(180,0,25,.25), transparent 28%),
        radial-gradient(circle at 10% 40%, rgba(90,0,15,.22), transparent 30%),
        linear-gradient(180deg, #160004 0%, #080204 55%, #020102 100%);
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

/* =========================
   FUNDO
========================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle, rgba(255,0,45,.10) 1px, transparent 1px);
    background-size: 45px 45px;
    opacity: .25;
    z-index: 0;
}

/* =========================
   MORCEGOS
========================= */

.bat {
    position: fixed;
    font-size: 25px;
    opacity: .55;
    z-index: 1;
    pointer-events: none;
    animation: fly 8s linear infinite;
}

.bat1 {
    top: 18%;
    left: -50px;
    animation-delay: 0s;
}

.bat2 {
    top: 38%;
    left: -80px;
    font-size: 19px;
    animation-delay: 3s;
}

.bat3 {
    top: 65%;
    left: -70px;
    font-size: 22px;
    animation-delay: 5s;
}

@keyframes fly {
    0% {
        transform: translateX(0) translateY(0) rotate(0deg);
    }

    50% {
        transform: translateX(55vw) translateY(-35px) rotate(-5deg);
    }

    100% {
        transform: translateX(115vw) translateY(15px) rotate(5deg);
    }
}

/* =========================
   CONTEÚDO
========================= */

.container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 720px;
    margin: auto;
    padding: 55px 20px 80px;
}

/* =========================
   LOGO
========================= */

header {
    text-align: center;
    margin-bottom: 125px;
}

.logo {
    position: relative;
    display: inline-block;
    font-size: clamp(42px, 12vw, 72px);
    font-weight: 900;
    letter-spacing: 4px;
    color: #fff;
    text-shadow:
        0 0 5px #fff,
        0 0 15px #ff003c,
        0 0 30px #ff003c,
        0 0 55px #b00025;
}

/* sangue escorrendo */

.logo::after {
    content: "";
    position: absolute;
    left: 25%;
    top: 85%;
    width: 8px;
    height: 35px;
    border-radius: 0 0 8px 8px;
    background: #d90032;
    box-shadow:
        30px 5px 0 #a90028,
        67px -2px 0 #e00035,
        110px 8px 0 #9c0023;
    filter: drop-shadow(0 0 6px #ff003c);
    animation: blood 3s ease-in-out infinite;
}

@keyframes blood {
    0%,100% {
        transform: scaleY(.65);
        opacity: .75;
    }

    50% {
        transform: scaleY(1.25);
        opacity: 1;
    }
}

.subtitle {
    margin-top: 30px;
    color: #b99da2;
    font-size: 15px;
    letter-spacing: 4px;
    text-transform: uppercase;
    line-height: 1.8;
}

/* =========================
   CARD ÚNICO
========================= */

.card {
    position: relative;
    background:
        linear-gradient(
            145deg,
            rgba(45,0,9,.92),
            rgba(8,2,4,.96)
        );

    border: 1px solid #8e1028;
    border-radius: 10px;
    padding: 48px 38px 40px;
    box-shadow:
        0 0 25px rgba(170,0,35,.15),
        inset 0 0 30px rgba(150,0,30,.06);
    overflow: hidden;
}

/* linha vermelha superior */

.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 125px;
    height: 6px;
    background: #ff003c;
    box-shadow:
        0 0 10px #ff003c,
        0 0 25px #ff003c;
}

/* brilho no canto */

.card::after {
    content: "✦";
    position: absolute;
    right: 28px;
    top: 25px;
    color: #ff1748;
    font-size: 30px;
    text-shadow:
        0 0 8px #ff003c,
        0 0 20px #ff003c;
    animation: sparkle 2s infinite alternate;
}

@keyframes sparkle {
    from {
        opacity: .4;
        transform: scale(.8) rotate(0deg);
    }

    to {
        opacity: 1;
        transform: scale(1.15) rotate(12deg);
    }
}

/* =========================
   TÍTULO DO PROMPT
========================= */

.card h2 {
    font-size: clamp(30px, 7vw, 48px);
    line-height: 1.15;
    margin-bottom: 45px;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 1px;

    text-shadow:
        0 0 5px #fff,
        0 0 12px rgba(255,0,50,.8);
}

/* pequena aparência de sangue */

.card h2::first-letter {
    filter: drop-shadow(0 0 8px #ff003c);
}

/* =========================
   TEXTO
========================= */

.card p {
    color: #d7c6c9;
    font-size: 20px;
    line-height: 1.9;
    margin-bottom: 38px;
}

/* =========================
   BOTÃO
========================= */

.copy {
    border: 1px solid #ff1748;
    border-radius: 5px;
    padding: 18px 30px;

    background:
        linear-gradient(
            135deg,
            #ff003c,
            #bd002c
        );

    color: white;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 1px;
    cursor: pointer;

    box-shadow:
        0 0 12px rgba(255,0,55,.55),
        0 0 30px rgba(255,0,55,.18);

    transition: .25s;
}

.copy:hover {
    transform: translateY(-2px);
    box-shadow:
        0 0 18px rgba(255,0,55,.8),
        0 0 40px rgba(255,0,55,.3);
}

.copy:active {
    transform: scale(.97);
}

/* =========================
   CONTROLE DA MÚSICA
========================= */

.music {
    display: block;
    margin: 35px auto 0;
    border: 1px solid #6f1023;
    background: rgba(25,2,7,.8);
    color: #d8bfc4;
    border-radius: 5px;
    padding: 12px 20px;
    font-size: 14px;
    cursor: pointer;
}

/* =========================
   RODAPÉ
========================= */

footer {
    text-align: center;
    margin-top: 55px;
    color: #6e555b;
    font-size: 12px;
    letter-spacing: 3px;
}

/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .container {
        padding: 42px 20px 70px;
    }

    header {
        margin-bottom: 105px;
    }

    .logo {
        font-size: 46px;
        letter-spacing: 2px;
    }

    .subtitle {
        font-size: 12px;
        letter-spacing: 3px;
    }

    .card {
        padding: 42px 34px 35px;
    }

    .card h2 {
        font-size: 34px;
        margin-bottom: 42px;
        max-width: 85%;
    }

    .card p {
        font-size: 19px;
        line-height: 1.9;
    }

    .copy {
        width: 100%;
        font-size: 16px;
    }
}
</style>
</head>

<body>

<!-- MORCEGOS -->
<div class="bat bat1">🦇</div>
<div class="bat bat2">🦇</div>
<div class="bat bat3">🦇</div>

<div class="container">

<header>

    <h1 class="logo">LUXE LAB</h1>

    <p class="subtitle">
        PROMPTS EXCLUSIVOS • COLABORADOR:<br>
        @AIKO_SEONG
    </p>

</header>

<!-- ÚNICA CAIXA -->
<section class="card">

    <h2>🎨 PROMPT<br>REALISTA</h2>

    <p id="prompt">
        Crie uma imagem ultra-realista, com iluminação
        cinematográfica, detalhes naturais da pele,
        sombras suaves, alta definição, profundidade de
        campo e aparência profissional.
    </p>

    <button class="copy" onclick="copiarPrompt()">
        📋 &nbsp; COPIAR PROMPT
    </button>

</section>

<!-- MÚSICA -->
<audio id="musica" loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<button class="music" onclick="controlarMusica()">
    🎵 Tocar música
</button>

<footer>
    ✦ LUXE LAB ✦
</footer>

</div>

<script>

/* =========================
   COPIAR PROMPT
========================= */

function copiarPrompt() {

    const texto = document.getElementById("prompt").innerText;

    navigator.clipboard.writeText(texto).then(() => {

        const botao = document.querySelector(".copy");

        botao.innerHTML = "✅ &nbsp; PROMPT COPIADO";

        setTimeout(() => {
            botao.innerHTML = "📋 &nbsp; COPIAR PROMPT";
        }, 2000);

    });

}


/* =========================
   MÚSICA
========================= */

const musica = document.getElementById("musica");
const botaoMusica = document.querySelector(".music");

function controlarMusica() {

    if (musica.paused) {

        musica.play();

        botaoMusica.innerHTML = "⏸️ Pausar música";

    } else {

        musica.pause();

        botaoMusica.innerHTML = "🎵 Tocar música";

    }

}

</script>

</body>
</html>
